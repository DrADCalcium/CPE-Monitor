[package]
name = "cpe-monitor"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
egui_software_backend = { path = "vendor/egui_software_backend" }
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ipconfig = "0.3"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
fontdb = "0.23"
ttf-parser = "0.25"
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
epaint = { path = "vendor/epaint" }
